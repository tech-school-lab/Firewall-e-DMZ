{t:"Introduzione e Parte 1 · VLAN, gateway, DHCP",k:[{p:["PC","SWP","CORE","DHCP"],c:"ok"}],g:[],hi:["CORE"],
e:"<p>La rete interna è divisa in <b>VLAN</b>: 10 Reception, 20 Clienti, 30 Server, 40 Gestione (reti /24 in 10.20.0.0/16). Il <b>CORE</b> (multilayer) è il gateway di ogni VLAN con una <b>SVI</b> e fa il routing tra loro. SW-PIANO ha porte access e un trunk verso il CORE. Il DHCP ha un pool per VLAN (gateway e DNS 203.0.113.10) e le SVI inoltrano le richieste con <b>ip helper-address</b>, perché SRV-DHCP sta in un’altra VLAN. Soddisfa R1 e R2.</p>",
x:"<ul><li><b>VLAN.</b> Divide uno switch in più reti logiche. È importante perché in un hotel convivono persone con diritti diversi: il cliente non deve stare nella rete dei server. Tra VLAN diverse i pacchetti passano solo da un router, dove si possono mettere regole.</li><li><b>Porta access.</b> Appartiene a una sola VLAN e toglie l’etichetta: PC e server non sanno di essere in una VLAN. Serve per collegare i dispositivi finali.</li><li><b>Trunk 802.1Q.</b> Un solo cavo che porta più VLAN, ognuna con un’etichetta (tag). Tra SW-PIANO e CORE serve perché reception e clienti usano lo stesso cavo. <i>allowed vlan</i> limita quali VLAN passano.</li><li><b>SVI.</b> È l’interfaccia IP virtuale della VLAN sul CORE: l’indirizzo .1 è il gateway dei PC di quella rete. Senza SVI la VLAN non può uscire.</li><li><b>ip routing.</b> Il 3560 di default lavora da switch. Il comando attiva il livello 3: senza, le SVI esistono ma i pacchetti non passano da una VLAN all’altra.</li><li><b>DHCP e helper-address.</b> La richiesta DHCP è un broadcast e non esce dalla VLAN. L’helper-address fa inoltrare la richiesta dal CORE verso SRV-DHCP. Ogni pool indica rete, gateway e DNS: gateway sbagliato = il PC non esce; DNS sbagliato = naviga solo per IP.</li><li><b>DNS 203.0.113.10.</b> Traduce i nomi in indirizzi IP. “Host Name Unresolved” significa DNS sbagliato o irraggiungibile.</li></ul>",
r:"<p>La Parte 1 non ha domande: serve a costruire la base. Saper spiegare: perché ci vuole <i>ip routing</i>, perché serve l’helper (il DHCP è un broadcast, che non esce dalla VLAN), a cosa serve il trunk.</p>",
f:"! CORE: VLAN, gateway (SVI) e routing\nvlan 10\n name Reception        ! (idem 20 Clienti, 30 Server, 40 Gestione)\ninterface vlan 10\n ip address 10.20.10.1 255.255.255.0   ! gateway della VLAN\n ip helper-address 10.20.30.10         ! inoltra il DHCP al server\n no shutdown\nip routing                             ! il 3560 fa routing tra VLAN\n! SW-PIANO\ninterface range fa0/1-2\n switchport mode access\n switchport access vlan 10             ! reception\ninterface range fa0/10-11\n switchport mode access\n switchport access vlan 20             ! clienti\ninterface gig0/1\n switchport mode trunk                 ! porta più VLAN verso il CORE\n switchport trunk allowed vlan 10,20,40",
d:"<p>Fatto: tabella delle VLAN, porte, trunk, pool DHCP con DNS 203.0.113.10, Internet simulata (R-ISP, SRV-INTERNET con HTTP+DNS, PC-CASA). Verifiche: ipconfig, ping tra PC interni, http://www.esterno.it da PC-CASA. Prove S1 (topologia), S2 (IP ricevuto da PC-REC1 e LAPTOP-CL1), S3 (browser di PC-CASA).</p>"},
{t:"Problema 1 · l’hotel non esce su Internet (R3)",k:[{p:ALL,c:"ok"}],g:[["src 10.20.x.x (privato)",425,172,"a"],["src 198.51.100.2",630,172,"ok"]],hi:["EDGE"],
e:"<p><b>Cosa succede.</b> Gli indirizzi 10.20.x.x sono <b>privati</b>: nessun router di Internet li instrada, quindi la risposta non saprebbe tornare.</p><p><b>Soluzione.</b> VLAN 50 di transito CORE (.1) ↔ R-EDGE (.2); default sul CORE verso R-EDGE; rotta 10.20.0.0/16 su R-EDGE verso il CORE; <b>PAT</b> su R-EDGE: tutto l’hotel esce con 198.51.100.2, distinguendo le sessioni dalle porte. R-ISP non ha rotte private.</p>",
x:"<ul><li><b>Indirizzi privati.</b> Il blocco 10.0.0.0/8 è riservato alle LAN (RFC 1918): ognuno lo usa a casa propria, quindi i router di Internet lo scartano. Un pacchetto con sorgente 10.20.10.6 arriva a SRV-INTERNET, ma la risposta non ha strada per tornare: per questo serve il NAT.</li><li><b>Rete di transito (VLAN 50).</b> È un collegamento di livello 3 dedicato CORE–R-EDGE. Due router, o un router e uno switch multilayer, per parlarsi devono avere un’interfaccia nella stessa rete. Tenerla separata dalle reti utenti evita di mescolare traffico degli utenti e traffico di instradamento.</li><li><b>Default sul CORE.</b> Il CORE conosce solo le sue VLAN. <i>ip route 0.0.0.0 0.0.0.0 10.20.50.2</i> significa “tutto il resto mandalo a R-EDGE”. Senza, i pacchetti verso 203.0.113.10 vengono scartati sul CORE.</li><li><b>Rotta di ritorno su R-EDGE.</b> La risposta, una volta riconvertita, ha destinazione 10.20.x.x: R-EDGE deve sapere che quelle reti stanno dietro il CORE. Senza, la risposta si ferma in R-EDGE.</li><li><b>access-list 1.</b> Qui non filtra: seleziona quali indirizzi interni possono essere tradotti (10.20.0.0 con wildcard 0.0.255.255).</li><li><b>ip nat inside / outside.</b> Indicano al router quale interfaccia guarda la rete da tradurre e quale il mondo esterno. Senza questi marcatori il NAT non scatta.</li><li><b>overload (PAT).</b> Molti host condividono un solo IP pubblico (198.51.100.2): il router cambia anche la porta sorgente e la annota nella tabella (<i>show ip nat translations</i>), per riportare ogni risposta all’host giusto.</li><li><b>R-ISP senza rotte private.</b> Il provider vede solo 198.51.100.2, come nella realtà. Una rotta verso 10.20.0.0/16 farebbe funzionare il ping anche senza NAT, ma nasconderebbe l’errore.</li></ul>",
r:"<p><b>1.</b> Rete di transito dedicata (VLAN 50, 10.20.50.0/24; la guida usa un /30). <b>2.</b> CORE: default verso R-EDGE; R-EDGE: 10.20.0.0/16 via CORE. <b>3.</b> Il provider conosce solo gli indirizzi pubblici dell’hotel e le reti private non si pubblicano: la rotta nasconderebbe il problema. <b>4.</b> Ne basta uno (198.51.100.2) con PAT; lo “presta” R-EDGE. <b>5.</b> Prima 10.20.10.6, dopo R-EDGE 198.51.100.2.</p>",
f:"! CORE\nvlan 50\n name Transito\ninterface fa0/24\n switchport mode access\n switchport access vlan 50\ninterface vlan 50\n ip address 10.20.50.1 255.255.255.0\n no shutdown\nip route 0.0.0.0 0.0.0.0 10.20.50.2       ! uscita: tutto verso R-EDGE\n! R-EDGE\ninterface g0/0\n ip address 10.20.50.2 255.255.255.0\n ip nat inside                            ! lato interno\n no shutdown\ninterface g0/1\n ip address 198.51.100.2 255.255.255.248\n ip nat outside                           ! lato provider\n no shutdown\nip route 0.0.0.0 0.0.0.0 198.51.100.1     ! default verso R-ISP\nip route 10.20.0.0 255.255.0.0 10.20.50.1 ! ritorno verso le reti interne\naccess-list 1 permit 10.20.0.0 0.0.255.255 ! chi viene tradotto\nip nat inside source list 1 interface g0/1 overload  ! PAT",
d:"<p>Cavo CORE Fa0/24 ↔ R-EDGE G0/0. <b>Intoppo 1:</b> ping da PC-REC1 con “unreachable” da 10.20.50.2: il pacchetto arrivava a R-EDGE (CORE ok) ma mancava la default verso 198.51.100.1. <b>Intoppo 2:</b> “Host Name Unresolved”: spazio dopo http:// e DNS dei pool da controllare. <b>Prove:</b> S4 browser LAPTOP-CL1; S5 show ip route CORE e R-EDGE; S6 Simulation (sorgente 10.20.10.6 → 198.51.100.2) e show ip nat translations.</p>"},
{t:"Problema 2 · i clienti vedono la reception (R3)",k:[{p:["CL","SWP","CORE","PC"],c:"bad",x:"CORE"},{p:["CL","SWP","CORE","EDGE","ISP","INT"],c:"ok"}],g:[["ACL CLIENTI-IN",330,165,"bad"],["Internet: permesso",630,172,"ok"]],hi:["CL","CORE"],
e:"<p><b>Cosa succede.</b> Il CORE instrada tra tutte le VLAN: un cliente raggiunge reception, server e switch.</p><p><b>Soluzione.</b> Una <b>ACL estesa</b> su interface vlan 20 in ingresso: permette il DHCP, nega 10.20.0.0/16 e R-EDGE, poi <i>permit ip any any</i> (Internet). Le regole si leggono dall’alto e vale la prima che corrisponde; in fondo c’è un deny implicito. Applicata vicino alla sorgente, scarta subito.</p>",
x:"<ul><li><b>ACL estesa.</b> Elenco ordinato di regole che guarda sorgente, destinazione, protocollo e porta. Quella standard guarda solo la sorgente: qui non basta, perché si deve distinguere dove vanno i clienti.</li><li><b>Ordine delle righe.</b> Il router scorre dall’alto e applica la prima regola che corrisponde, poi si ferma. Se il <i>permit ip any any</i> stesse in cima, i deny non verrebbero mai letti.</li><li><b>permit udp bootpc/bootps.</b> Il laptop che chiede l’IP non ne ha ancora uno: invia da porta 68 a porta 67. Senza questa riga il DHCP potrebbe non funzionare con l’ACL attiva.</li><li><b>deny verso 198.51.100.2.</b> R-EDGE ha un indirizzo pubblico ma è un dispositivo interno: un cliente non deve poterlo raggiungere.</li><li><b>deny verso 10.20.0.0/16.</b> Blocca reception, server, gestione, transito e anche i gateway del CORE. La wildcard 0.0.255.255 indica “ignora gli ultimi due byte”.</li><li><b>permit ip any any.</b> Lascia passare tutto il resto, cioè Internet. Sta in fondo perché prima si è già negato l’interno.</li><li><b>deny implicito.</b> Ogni ACL termina con un deny invisibile: ciò che non corrisponde a nessuna riga viene scartato.</li><li><b>Interfaccia e direzione.</b> <i>in</i> su vlan 20: il filtro lavora subito, quando il pacchetto entra nel CORE, vicino alla sorgente. Senza <i>ip access-group</i> l’ACL esiste ma non filtra: è l’errore segnalato dal prof.</li><li><b>Contatori.</b> <i>show access-lists</i> conta i pacchetti per riga: è la prova che le deny stanno bloccando.</li></ul>",
r:"<p><b>1.</b> “Tutto il resto” ora comprende Internet, ma anche reti interne non nominate: per questo prima si negano tutte le 10.20.0.0/16. <b>2.</b> Su interface vlan 20, direzione <i>in</i>: i clienti entrano nel CORE da lì. <b>3.</b> Con <i>permit ip any any</i> finale no: il DNS 203.0.113.10 è fuori da 10.20.0.0/16. Se l’ultima riga fosse un deny, servirebbe permit udp … eq 53.</p>",
f:"ip access-list extended CLIENTI-IN\n permit udp any eq bootpc any eq bootps                  ! DHCP\n deny ip 10.20.20.0 0.0.0.255 host 198.51.100.2          ! R-EDGE è interno\n deny ip 10.20.20.0 0.0.0.255 10.20.0.0 0.0.255.255      ! tutte le reti interne\n permit ip any any                                       ! il resto = Internet\ninterface vlan 20\n ip access-group CLIENTI-IN in     ! senza questa riga l’ACL non filtra nulla\nshow access-lists                  ! contatori delle righe",
d:"<p><b>Intoppo:</b> l’ACL esisteva ma non era applicata alla SVI (segnalato dal prof) → <i>ip access-group CLIENTI-IN in</i>. Prova: da LAPTOP-CL1 ping a PC-REC1 in timeout (bloccato), ping a 203.0.113.10 riuscito, http://www.esterno.it aperto. <b>Prove:</b> S7 stessa finestra con ping fallito e riuscito; S8 show access-lists CORE con contatori &gt; 0 sulle deny.</p>"},
{t:"Problema 3 · il sito delle prenotazioni (R4)",k:[{p:["INT","ISP","EDGE","CORE","WEB"],c:"ok"}],g:[["dst 198.51.100.3",630,172,"ok"],["NAT statico",520,255,"a"]],hi:["WEB","EDGE"],
e:"<p><b>Cosa succede.</b> SRV-WEB ha un IP privato e il PAT parte solo dall’interno: da Internet non si raggiunge.</p><p><b>Soluzione.</b> IP pubblico dedicato 198.51.100.3 con <b>NAT statico</b> su R-EDGE verso SRV-WEB (la corrispondenza è scritta in anticipo) e record DNS www.belvedere.it → 198.51.100.3 su SRV-INTERNET. Su R-ISP non si aggiunge nulla.</p>",
x:"<ul><li><b>Perché il PAT non basta.</b> Il PAT crea la traduzione quando un host interno inizia la comunicazione. Qui inizia PC-CASA: R-EDGE non ha ancora nessuna voce in tabella e scarterebbe il pacchetto.</li><li><b>NAT statico.</b> È una corrispondenza fissa 1 a 1 tra 198.51.100.3 e l’IP privato di SRV-WEB, scritta in anticipo. Così R-EDGE sa a chi consegnare le richieste in arrivo.</li><li><b>IP dedicato.</b> Il .2 è già usato dal PAT di tutto l’hotel; il .3 identifica solo il sito e rende la regola semplice e controllabile.</li><li><b>Record DNS A.</b> Il browser digita www.belvedere.it: il DNS di SRV-INTERNET risponde 198.51.100.3. Senza record il sito esiste ma nessuno trova il nome.</li><li><b>Niente su R-ISP.</b> L’indirizzo .3 sta nella rete 198.51.100.0/29, già collegata direttamente a R-ISP: lui lo raggiunge via ARP senza rotte aggiuntive.</li><li><b>Cosa non si deve dimenticare.</b> Il NAT statico apre il server a ogni protocollo (anche il ping): è la ragione dei problemi successivi.</li><li><b>NAT hairpin.</b> Un cliente in camera risolve l’IP pubblico e il pacchetto deve uscire e rientrare dallo stesso router: non tutti i dispositivi lo gestiscono, quindi si prova e si annota.</li></ul>",
r:"<p><b>1.</b> Uno dedicato (.3): la navigazione resta su .2 con PAT. <b>2.</b> Inizia PC-CASA, da fuori: R-EDGE deve conoscere in anticipo la corrispondenza pubblico→privato. <b>3.</b> Non garantito: il cliente risolve l’IP pubblico e il pacchetto rientra dallo stesso router (<b>NAT hairpin</b>): va provato e annotato.</p>",
f:"! R-EDGE: NAT statico 1 a 1\nip nat inside source static 10.20.30.10 198.51.100.3\n! SRV-INTERNET > Services > DNS > Add\n!  Name www.belvedere.it  Type A  Address 198.51.100.3\nshow ip nat translations      ! riga statica + sessioni TCP 80",
d:"<p>HTTP su SRV-WEB con “Hotel Belvedere · Prenotazioni”. Prova: da PC-CASA http://10.20.30.x non si apre, http://www.belvedere.it sì. <b>Prove:</b> S9 browser PC-CASA; S10 show ip nat translations; Simulation: all’andata destinazione .3 → privato, al ritorno sorgente privato → .3. Cliente in camera su www.belvedere.it: da verificare e annotare (hairpin).</p>"},
{t:"Problema 4 · il sito viene violato (R6)",k:[{p:["WEB","EDGE","CORE","SWP","PC"],c:"a"}],g:[["VLAN 60 · DMZ",610,300,"d"],["nessuna SVI sul CORE",330,250,"d"],["passa da R-EDGE",420,262,"a"]],hi:["WEB"],
e:"<p><b>Cosa succede.</b> Se SRV-WEB viene violato, dalla VLAN server raggiunge ciò che il CORE instrada.</p><p><b>Soluzione.</b> Una <b>DMZ</b>: VLAN 60, 10.20.60.0/24, <b>senza SVI sul CORE</b>. Il gateway è il dispositivo di confine (qui R-EDGE con sottointerfacce e trunk 50+60; nel problema 7 il firewall). Il NAT statico punta al nuovo IP 10.20.60.10.</p>",
x:"<ul><li><b>Modello dell’attaccante.</b> Si assume che SRV-WEB venga violato: è l’unico dispositivo raggiungibile da Internet, quindi il primo bersaglio. L’obiettivo è limitare i danni: dal server compromesso si deve poter arrivare solo dove il firewall lo consente.</li><li><b>Perché la VLAN da sola non basta.</b> Se il CORE ha l’SVI della DMZ, conosce direttamente DMZ e LAN e le instrada: il traffico non incontra nessun filtro.</li><li><b>Niente SVI sul CORE.</b> La VLAN 60 esiste solo a livello 2: il CORE la inoltra ma non la instrada. L’unico gateway, e quindi l’unica uscita, è il dispositivo di confine.</li><li><b>Trunk con VLAN 50 e 60.</b> SRV-WEB resta fisicamente sul CORE (vincolo dell’unico armadio); un solo cavo verso R-EDGE porta sia il transito sia la DMZ.</li><li><b>Sottointerfacce (router-on-a-stick).</b> Un’interfaccia fisica di R-EDGE si divide in due interfacce logiche, una per VLAN. <i>encapsulation dot1Q 60</i> gli dice quale tag leggere.</li><li><b>IP statico su SRV-WEB.</b> 10.20.60.10 con gateway 10.20.60.1: i server pubblici non devono dipendere dal DHCP.</li><li><b>Aggiornare il NAT.</b> Il privato di SRV-WEB cambia, quindi si toglie la vecchia riga statica e se ne scrive una nuova. IP pubblico e DNS non cambiano.</li><li><b>Verifica.</b> Il tracert da SRV-WEB a PC-REC1 deve mostrare come primo salto R-EDGE (10.20.60.1). Raggiungere PC-REC1 è ancora normale: manca il firewall.</li></ul>",
r:"<p><b>1.</b> No: con l’SVI sul CORE la DMZ verrebbe instradata verso la LAN senza filtro. <b>2.</b> L’interfaccia del dispositivo di confine (R-EDGE, poi dmz del FW 10.20.60.1); SRV-WEB resta sul CORE, ma la VLAN arriva al confine. <b>3.</b> Il privato del NAT diventa 10.20.60.10; IP pubblico e DNS restano uguali.</p>",
f:"! CORE\nvlan 60\n name DMZ                          ! nessuna interface vlan 60!\ninterface fa0/3\n switchport mode access\n switchport access vlan 60          ! porta di SRV-WEB\ninterface fa0/24\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan 50,60\n! R-EDGE (router-on-a-stick)\ninterface g0/0.50\n encapsulation dot1Q 50\n ip address 10.20.50.2 255.255.255.0\n ip nat inside\ninterface g0/0.60\n encapsulation dot1Q 60\n ip address 10.20.60.1 255.255.255.0   ! gateway della DMZ\n ip nat inside\nno ip nat inside source static 10.20.30.10 198.51.100.3\nip nat inside source static 10.20.60.10 198.51.100.3",
d:"<p>Prova da attaccante: da SRV-WEB ping a SRV-DHCP, PC-REC1, PC-TECNICO e SW-PIANO rispondevano. <b>Intoppo:</b> dopo la modifica il ping SRV-WEB → 10.20.60.1 non andava: controllati IP/gateway statici, show vlan brief (Fa0/3 in 60), show interfaces trunk e no shutdown su g0/0. <b>Prova S11:</b> IP config di SRV-WEB e tracert verso PC-REC1 con primo salto R-EDGE. Questa parte è poi sostituita dal firewall (problema 7).</p>"},
{t:"Problema 5 · la DMZ arriva fino alle camere (R8)",k:[{p:["HALL","SWP"],c:"bad",x:"HALL"}],g:[["trunk 10 · 20 · 40",262,125,"a"],["VLAN 99 · porta spenta",190,272,"bad"],["port security: 1 MAC",490,318,"ok"]],hi:["HALL","SWP"],
e:"<p><b>Cosa succede.</b> Un trunk senza limiti porta la DMZ fino al piano e la presa libera della hall dà accesso.</p><p><b>Soluzione.</b> Trunk con le sole VLAN utili (10,20,40); porte libere in <b>VLAN 99</b> senza gateway e spente; <b>port security</b> sulla porta di SRV-WEB: un solo MAC, appreso (sticky), violazione = porta spenta.</p>",
x:"<ul><li><b>Perché limitare i trunk.</b> Un trunk senza <i>allowed vlan</i> porta tutte le VLAN: la DMZ arriverebbe a SW-PIANO e chi collega un dispositivo a una presa del piano potrebbe entrarci. Si applica il principio del minimo necessario: su ogni cavo solo le VLAN che servono.</li><li><b>Attenzione alla sintassi.</b> <i>switchport trunk allowed vlan 10,20,40</i> sostituisce l’intera lista; per aggiungere una VLAN serve <i>add</i>. L’errore del 08.3.3 è sovrascrivere la lista e togliere le altre VLAN: si controlla sempre con <i>show interfaces trunk</i>.</li><li><b>VLAN 99 “Parcheggio”.</b> Rete senza gateway e senza DHCP: anche se una porta venisse riattivata, il dispositivo non otterrebbe un indirizzo né una strada.</li><li><b>shutdown.</b> Una porta spenta non accetta nulla: è la prima barriera contro la presa della hall.</li><li><b>switchport mode access.</b> Impedisce a una porta libera di negoziare un trunk con un dispositivo estraneo.</li><li><b>Port security.</b> <i>maximum 1</i> = un solo MAC consentito; <i>sticky</i> = la porta impara il MAC di SRV-WEB e lo ricorda; <i>violation shutdown</i> = se arriva un altro MAC la porta va in err-disabled (si riattiva con shutdown e no shutdown).</li><li><b>Errore nel range.</b> Il range delle porte libere deve escludere le porte in uso: includere Fa0/10-11 ha spento i laptop dei clienti.</li><li><b>Cosa succede con un portatile al posto del server.</b> Il MAC è diverso da quello imparato: la porta si spegne e non entra nella DMZ.</li></ul>",
r:"<p><b>1.</b> La DMZ solo tra SRV-WEB e firewall (il CORE la inoltra a livello 2), mai su SW-PIANO; il transito solo tra chi lo usa. <b>2.</b> <i>trunk allowed vlan X</i> sostituisce la lista: serve <i>add</i> per non togliere le altre (errore del 08.3.3); si controlla con show interfaces trunk. <b>3.</b> Il portatile ha un MAC diverso: la porta va in violation/err-disabled e non entra.</p>",
f:"! trunk: solo le VLAN che servono (CORE e SW-PIANO)\ninterface gig0/1\n switchport trunk allowed vlan 10,20,40\n! porte libere (ESCLUDI quelle in uso!)\nvlan 99\n name Parcheggio\ninterface range fa0/3 - 9 , fa0/12 - 24 , gig0/2   ! su SW-PIANO\n switchport mode access\n switchport access vlan 99\n shutdown\n! port security sulla porta di SRV-WEB (CORE)\ninterface fa0/3\n switchport port-security\n switchport port-security maximum 1\n switchport port-security mac-address sticky\n switchport port-security violation shutdown\nshow port-security interface fa0/3",
d:"<p>Prova prima: show interfaces trunk su SW-PIANO e LAPTOP-INTRUSO su Fa0/24 riceveva un indirizzo. <b>Intoppo:</b> le porte dei laptop (Fa0/10-11) sono diventate rosse: il range delle porte libere le includeva → no shutdown e access VLAN 20, range corretto. <b>Prove:</b> S12 show interfaces trunk (CORE e SW-PIANO); S13 show port-security interface fa0/3; S14 IP config di LAPTOP-INTRUSO senza indirizzo. Da ricontrollare: sul CORE le porte libere risultavano ancora in VLAN 1.</p>"},
{t:"Problema 6 · un’ACL sul router di confine basta? (R5)",k:[{p:["INT","ISP","EDGE"],c:"bad",x:"EDGE"},{p:["INT","ISP","EDGE","WEB"],c:"ok"}],g:[["BORDO-IN",520,150,"a"],["ping da fuori: deny",640,178,"bad"]],hi:["EDGE"],
e:"<p><b>Cosa succede.</b> Un’ACL guarda un pacchetto alla volta: se in ingresso su G0/1 si permette solo HTTP verso il sito, anche le risposte per i PC interni finiscono nel deny implicito.</p><p><b>Soluzione provata.</b> BORDO-IN: sito (.3:80), risposte web con <i>established</i>, DNS dal server, echo-reply, deny. <b>Limite:</b> established guarda solo il flag ACK e si può falsificare; ogni nuovo servizio richiede nuove righe. Serve un firewall <b>stateful</b>.</p>",
x:"<ul><li><b>ACL stateless.</b> Un’ACL guarda ogni pacchetto da sola e non ricorda le comunicazioni precedenti. Se in ingresso su G0/1 si permette solo HTTP verso il sito, la risposta di www.esterno.it ai PC interni non corrisponde a nessuna riga e cade nel deny implicito.</li><li><b>Richiesta e risposta.</b> La richiesta va dal PC (porta alta, per esempio 49152) al server porta 80. La risposta va dal server (porta sorgente 80) al PC (porta alta): direzione e porte invertite, quindi è un pacchetto diverso per l’ACL.</li><li><b>Riga 10.</b> Permette TCP verso 198.51.100.3 porta 80. Si usa l’IP pubblico perché l’ACL in ingresso su G0/1 legge il pacchetto prima del NAT.</li><li><b>Riga 20 con established.</b> Permette TCP con porta sorgente 80 verso 198.51.100.2 solo se il segmento ha il flag ACK o RST. Non conosce la sessione: un attaccante può costruire pacchetti con ACK.</li><li><b>Riga 30.</b> Permette le risposte DNS dal solo server 203.0.113.10 (UDP porta 53). UDP non ha flag: la regola si basa solo su indirizzo e porta.</li><li><b>Riga 40.</b> Permette echo-reply, le risposte ai ping dell’interno. Non permette echo-request, quindi il ping da fuori resta bloccato.</li><li><b>Riga 50.</b> Deny esplicito: si scrive per vedere i contatori (il deny implicito non li mostra).</li><li><b>Perché non basta.</b> Ogni nuovo servizio richiede righe nuove; l’ICMP e l’UDP non si riconoscono bene; il router non ricorda chi ha iniziato. Serve un firewall stateful.</li></ul>",
r:"<p><b>1.</b> La risposta ha porta sorgente 80 e porta destinazione effimera: non è una richiesta al sito. <b>2.</b> established vale solo per TCP (ACK/RST), non per DNS (UDP) né per il ping (ICMP). <b>3.</b> Servono righe per ogni servizio; se il DNS cambia porta sorgente la regola rigida fallisce o diventa troppo larga. <b>4.</b> Chi ha iniziato, IP, porte, protocollo e stato di ogni sessione.</p>",
f:"ip access-list extended BORDO-IN\n permit tcp any host 198.51.100.3 eq 80                  ! il sito (IP pubblico: ACL prima del NAT)\n permit tcp any eq 80 host 198.51.100.2 established      ! risposte web\n permit udp host 203.0.113.10 eq 53 host 198.51.100.2    ! risposte DNS\n permit icmp any host 198.51.100.2 echo-reply            ! risposte al ping interno\n deny ip any any                                         ! con contatore (per S15)\ninterface g0/1\n ip access-group BORDO-IN in\nshow access-lists",
d:"<p>Con la sola riga HTTP: PC-CASA apre belvedere.it ma PC-REC1 non apre esterno.it. Con l’ACL completa: riga 10 = 6 match, riga 30 = 2, deny = 8; righe 20 e 40 a zero finché non si prova web e ping da PC-REC1. Ping da PC-CASA a 198.51.100.3 → unreachable da .2 (corretto). <b>S15:</b> show access-lists dopo tutti i test. Tabella: sito da fuori sì, web dentro sì, DNS sì, ping dentro sì, ping da fuori no.</p>"},
{t:"Problema 7 · arriva il firewall (R3, R5, R6)",k:[{p:ALF,c:"ok"},{p:["WEB","FW","CORE"],c:"bad",x:"FW"}],g:[["NAT su R-EDGE",640,172,"ok"],["DMZ non inizia verso l’interno",470,262,"bad"]],hi:["FW"],z:1,
e:"<p><b>Soluzione.</b> Firewall <b>stateful</b> ASA a tre zone: inside 100 (G1/2, 10.20.50.2), dmz 50 (G1/3, 10.20.60.1), outside 0 (G1/1, 10.20.70.1). Rotte: default verso R-EDGE, 10.20.0.0/16 verso il CORE. Le risposte rientrano perché il firewall ricorda le sessioni (inspect).</p><p><b>NAT.</b> Nel simulatore l’ASA non traduce (“NAT table does not have a matched entry”): il NAT torna su R-EDGE, tra FW e provider (rete 10.20.70.0/24).</p>",
x:"<ul><li><b>Perché un firewall.</b> Un router con ACL non ricorda le connessioni; il firewall sì. Così consente le risposte alle richieste interne senza aprire le connessioni dall’esterno.</li><li><b>Tabella di stato.</b> Quando PC-REC1 apre una connessione, il firewall registra indirizzi, porte e protocollo. La risposta che corrisponde rientra automaticamente: per questo non si scrivono regole per le risposte.</li><li><b>nameif.</b> Dà all’interfaccia un nome logico (inside, dmz, outside) che si usa in rotte, ACL e regole.</li><li><b>security-level.</b> 100 = massima fiducia (LAN), 50 = DMZ, 0 = Internet. Il traffico può iniziare da un livello alto verso uno più basso; il contrario è bloccato finché non c’è una regola.</li><li><b>Cosa ne deriva.</b> inside→outside passa (navigazione); inside→dmz passa; dmz→inside bloccato (R6); outside→inside e outside→dmz bloccati (R5).</li><li><b>Rotte.</b> Il firewall non vede da solo le reti oltre le sue interfacce: default verso R-EDGE e 10.20.0.0/16 verso il CORE.</li><li><b>inspect.</b> Alcuni protocolli richiedono un trattamento speciale perché la risposta rientri. Dns, icmp e http devono essere presenti nella <i>global_policy</i>, altrimenti la risposta viene scartata.</li><li><b>Perché il NAT è su R-EDGE.</b> Nel simulatore l’ASA accetta il comando ma non traduce (messaggio “NAT table does not have a matched entry”): i pacchetti uscirebbero con IP privato. R-EDGE rimane tra FW e provider, nella rete 10.20.70.0/24.</li><li><b>CORE Fa0/24 in access.</b> Il firewall non gestisce i tag VLAN su questa porta: la porta del CORE deve essere access VLAN 50.</li><li><b>Errori tipici.</b> <i>exit</i> dopo un oggetto fa uscire dalla configurazione; show conn e clear xlate non esistono nel simulatore; sottointerfacce e rotte vecchie su R-EDGE fanno scartare il ritorno.</li></ul>",
r:"<p><b>1.</b> Il nome identifica la zona, il livello la fiducia: 100, 50, 0. <b>2.</b> Passa da livello alto a basso; il contrario è bloccato; le risposte rientrano per la tabella di stato. <b>3.</b> Rete FW–R-EDGE nuova (10.20.70.0/24). CORE: default verso FW; FW: default verso R-EDGE e reti interne via CORE; R-EDGE: 10.20.0.0/16 via FW. Nel NAT di R-EDGE il lato FW è inside, il lato R-ISP outside. <b>4.</b> Il firewall ha registrato la richiesta uscita da inside e la risposta corrisponde.</p>",
f:"! FW ASA\ninterface g1/1\n nameif outside\n security-level 0\n ip address 10.20.70.1 255.255.255.0\n no shutdown\ninterface g1/2\n nameif inside\n security-level 100\n ip address 10.20.50.2 255.255.255.0\n no shutdown\ninterface g1/3\n nameif dmz\n security-level 50\n ip address 10.20.60.1 255.255.255.0\n no shutdown\nroute outside 0.0.0.0 0.0.0.0 10.20.70.2    ! verso R-EDGE\nroute inside 10.20.0.0 255.255.0.0 10.20.50.1 ! verso il CORE\npolicy-map global_policy\n class inspection_default\n  inspect http                  ! + dns, icmp: le risposte rientrano\n! NON usare exit dopo oggetti/policy: porta fuori dal config\n! R-EDGE: g0/0 10.20.70.2 inside, g0/1 198.51.100.2 outside, PAT come nel P1\n! rotta ritorno: ip route 10.20.0.0 255.255.0.0 10.20.70.1\n! CORE: fa0/24 access vlan 50 (non più trunk)",
d:"<p>Su richiesta del prof SRV-WEB è collegato direttamente a FW G1/3. <b>Intoppi:</b> (a) <i>exit</i> dopo l’oggetto NAT mi portava fuori dal config; (b) show conn e clear xlate non esistono; (c) il NAT dell’ASA non traduceva → PAT su R-EDGE; (d) dopo la perdita di configurazione le G1/x erano administratively down; (e) il web non rientrava perché su R-EDGE c’erano ancora le sottointerfacce .50/.60 e due rotte 10.20.0.0/16 → rimosse; ACL OUT-IN provata e tolta. <b>Prove:</b> S16 show nameif e interface ip brief; S17 ping SRV-WEB → PC-REC1 fallito; Simulation prima/dopo R-EDGE.</p>"},
{t:"Problema 8 · il firewall “rompe” il ping",k:[{p:ALF,c:"ok"},{p:["INT","ISP","EDGE"],c:"bad",x:"EDGE"}],g:[["inspect icmp",470,172,"a"],["ping da fuori: no",640,178,"bad"]],hi:["FW","EDGE"],z:1,
e:"<p>Il ping usa <b>ICMP</b>, non TCP: non ha porte né connessione. Si attiva l’ispezione ICMP sul FW (rientrano le risposte ai ping partiti dall’interno) senza aprire ICMP da outside. R-EDGE risponde ai ping verso il proprio IP pubblico (non passano dal FW): si filtra in ingresso su G0/1.</p>",
x:"<ul><li><b>ICMP.</b> Protocollo di servizio, senza porte e senza connessione. Il ping manda un echo-request (tipo 8) e riceve un echo-reply (tipo 0).</li><li><b>Perché il firewall lo blocca.</b> Non c’è una sessione TCP da ricordare: se l’echo-reply non viene riconosciuto come risposta, il firewall lo scarta e il ping fallisce anche se il web funziona.</li><li><b>inspect icmp.</b> Il firewall registra l’echo-request uscito e lascia rientrare il corrispondente echo-reply. Prima si guarda con <i>show running-config policy-map</i> cosa c’è già.</li><li><b>Perché non aprire ICMP da outside.</b> Una regola che permette ICMP in ingresso farebbe rispondere l’hotel ai ping di Internet: viola R5.</li><li><b>Il caso di R-EDGE.</b> Un ping a 198.51.100.2 è indirizzato al router stesso: non attraversa il firewall, quindi R-EDGE risponde. Si blocca con l’ACL BORDO-IN su G0/1.</li><li><b>Timeout o unreachable.</b> “Unreachable” da 198.51.100.2 = R-EDGE ha scartato con l’ACL e lo ha segnalato; “timeout” = scartato in silenzio, oppure l’indirizzo non esiste (.4 e .5).</li></ul>",
r:"<p><b>1.</b> No: il ping non usa TCP né ha sessione TCP. <b>2.</b> Inspection = il firewall analizza un protocollo per gestire risposte e traffico correlato; di fabbrica varia: va controllata con show running-config policy-map. <b>3.</b> Aprire il ping da fuori permetterebbe a Internet di iniziarlo (viola R5). <b>4.</b> 198.51.100.2 termina su R-EDGE: se risponde, R5 non è rispettata; si usa BORDO-IN.</p>",
f:"! FW\nshow running-config policy-map   ! controlla cosa si ispeziona già\npolicy-map global_policy\n class inspection_default\n  inspect icmp                   ! risposte ai ping interni\n! R-EDGE: BORDO-IN del P6 su g0/1 blocca l’echo-request da fuori\nshow running-config interface g0/1",
d:"<p>In corso. S19: prompt di PC-CASA con ping falliti verso gli indirizzi pubblici. .4 e .5 non esistono (timeout normale): vanno provati .2 e .3. Timeout o “unreachable” dipende da chi scarta: ACL di R-EDGE → unreachable da .2; firewall → silenzio. Verificare ip access-group su g0/1.</p>"},
{t:"Problema 9 · pubblicare il sito attraverso il firewall",k:[{p:["INT","ISP","EDGE","FW","WEB"],c:"ok"}],g:[["NAT statico",640,172,"a"],["ACL outside: solo TCP 80",470,262,"ok"]],hi:["EDGE","FW"],z:1,
e:"<p>Con il firewall le connessioni nate fuori sono bloccate. Due funzioni distinte: <b>R-EDGE traduce</b> 198.51.100.3 → 10.20.60.10; <b>l’ASA autorizza</b> solo TCP/80 verso 10.20.60.10 con ACL in ingresso su outside. Nell’ACL si scrive l’IP reale, perché la traduzione è già avvenuta.</p>",
x:"<ul><li><b>Due funzioni diverse.</b> Tradurre e autorizzare non sono la stessa cosa: R-EDGE cambia l’indirizzo, il firewall decide se il pacchetto può entrare.</li><li><b>NAT statico su R-EDGE.</b> Trasforma la destinazione 198.51.100.3 in 10.20.60.10. Senza, il pacchetto non saprebbe a quale server consegnare.</li><li><b>Ordine di elaborazione.</b> Il pacchetto arriva a R-EDGE (traduzione), poi al firewall che lo vede già con destinazione 10.20.60.10. Per questo l’ACL del firewall nomina l’IP reale.</li><li><b>ACL su outside, in ingresso.</b> Una sola riga: permit tcp any host 10.20.60.10 eq 80. È il principio del minimo privilegio: solo il servizio pubblicato.</li><li><b>Il ritorno.</b> La risposta del sito esce senza regole, perché il firewall ha registrato la richiesta.</li><li><b>Cosa verificare.</b> PC-CASA apre www.belvedere.it; ping al sito e a 198.51.100.2 falliscono; show access-list mostra i contatori. Se dopo l’ACL qualcosa interno si rompe, annotarlo come limite del simulatore.</li></ul>",
r:"<p><b>1.</b> R-EDGE traduce, l’ASA permette. <b>2.</b> L’indirizzo reale della DMZ. <b>3.</b> Interfaccia outside, direzione <i>in</i>: la richiesta entra da Internet.</p>",
f:"! R-EDGE\nip nat inside source static 10.20.60.10 198.51.100.3\n! FW\naccess-list OUT-IN extended permit tcp any host 10.20.60.10 eq 80\naccess-group OUT-IN in interface outside\n! test: PC-CASA http://www.belvedere.it sì; ping no",
d:"<p>Da svolgere: NAT statico, ACL sul FW, prova da PC-CASA. Se dopo l’ACL web/DNS/ping interni si rompono, annotarlo come limite del simulatore e chiedere al prof.</p>"},
{t:"Problema 10 · la scorciatoia del CORE (R6)",k:[{p:["WEB","CORE","SWP","PC"],c:"bad",x:"CORE"}],g:[["SVI DMZ sul CORE = errore",330,165,"bad"]],hi:["CORE"],z:1,
e:"<p>Se il CORE ha un’SVI nella DMZ è un gateway alternativo: un SRV-WEB compromesso cambia gateway e raggiunge la LAN <b>saltando il firewall</b>. Soluzione: nessuna interface vlan della DMZ sul CORE; l’unico gateway è la dmz del firewall.</p>",
x:"<ul><li><b>Cosa si vuole evitare.</b> Se il CORE ha un’interfaccia IP nella DMZ, SRV-WEB può usarlo come gateway: il CORE lo instrada verso le VLAN interne e il firewall non vede nulla.</li><li><b>Chi controlla il server decide il gateway.</b> Un attaccante può cambiare a mano l’IP del gateway: se il CORE risponde, il firewall viene aggirato. Con un solo gateway possibile, il firewall, ogni strada passa dal controllo.</li><li><b>Chi ha un indirizzo nella DMZ.</b> Solo SRV-WEB e l’interfaccia dmz del firewall. Il CORE no.</li><li><b>Come si scopre una scorciatoia.</b> <i>show ip interface brief</i> sul CORE: una Vlan della DMZ con indirizzo IP è l’interfaccia di troppo. Si toglie con <i>no interface vlan</i>.</li><li><b>Nel tuo progetto.</b> SRV-WEB è collegato direttamente al firewall e il CORE non ha SVI della DMZ: la condizione è già rispettata e va solo dimostrata.</li></ul>",
r:"<p><b>1.</b> Con l’SVI il CORE conosce DMZ e VLAN interne e le instrada: il pacchetto non passa dal FW. <b>2.</b> IP nella DMZ: SRV-WEB e interfaccia dmz dell’ASA. <b>3.</b> show ip interface brief: una Vlan DMZ con IP sul CORE è l’interfaccia di troppo.</p>",
f:"show ip interface brief       ! non deve esserci una Vlan della DMZ con IP\nno interface vlan 60          ! se esiste, va tolta",
d:"<p>Da svolgere (il mio progetto è già coerente: nessuna SVI 60 e SRV-WEB sul FW). Prova: da SRV-WEB cambiare il gateway a mano e fare ping a PC-REC1: deve fallire.</p>"},
{t:"Problema 11 · chi aggiorna il sito e gestisce il firewall (R7)",k:[{p:["TEC","CORE","FW","WEB"],c:"ok"},{p:["CL","SWP","CORE","FW"],c:"bad",x:"FW"}],g:[["FTP solo dal tecnico",470,262,"ok"]],hi:["TEC"],z:1,
e:"<p>Solo PC-TECNICO usa FTP verso SRV-WEB e gestisce FW e switch con <b>SSH</b> (cifrato; Telnet trasmette in chiaro). Si applica un’ACL su inside: vanno permessi esplicitamente DNS, web e gli altri servizi legittimi. Il filtro clienti sul CORE resta: seconda barriera.</p>",
x:"<ul><li><b>FTP.</b> Trasferisce i file, ma in chiaro: password e contenuti sono leggibili. Va consentito solo a chi deve aggiornare il sito, cioè PC-TECNICO, e solo verso SRV-WEB (TCP 21).</li><li><b>Perché l’ACL su inside cambia tutto.</b> Senza ACL il traffico segue i livelli di sicurezza. Con un’ACL su inside vale solo ciò che è scritto: vanno autorizzati DNS (UDP 53), web (TCP 80/443) e gli altri flussi legittimi, altrimenti la navigazione si blocca.</li><li><b>Ordine delle regole.</b> Prima i permessi specifici (DNS, FTP del tecnico, web), poi il deny implicito.</li><li><b>SSH.</b> Gestione remota cifrata. Telnet manda tutto in chiaro, anche la password. Sull’ASA <i>ssh rete maschera inside</i> permette l’accesso solo da PC-TECNICO e solo dall’interfaccia inside. Su SW-PIANO servono chiavi RSA, utente locale e <i>transport input ssh</i> sulle linee vty.</li><li><b>Il filtro clienti sul CORE.</b> Resta: è una seconda barriera. Se il firewall sbaglia, i clienti sono comunque fermati dal CORE.</li><li><b>Firewall locale su SRV-WEB.</b> Terza barriera: anche se una regola del perimetro è sbagliata, il server accetta solo HTTP e, dal tecnico, FTP.</li></ul>",
r:"<p><b>1.</b> Con un’ACL su inside non valgono più i permessi impliciti dei livelli: si autorizzano DNS, HTTP/HTTPS e i flussi richiesti. <b>2.</b> Si tiene (difesa in profondità), verificando che non blocchi servizi dovuti. <b>3.</b> Con <i>ssh rete maschera inside</i>: sorgente e interfaccia autorizzate.</p>",
f:"access-list INSIDE-IN extended permit udp 10.20.0.0 255.255.0.0 host 203.0.113.10 eq 53  ! DNS\naccess-list INSIDE-IN extended permit tcp host 10.20.40.10 host 10.20.60.10 eq 21        ! FTP solo tecnico\naccess-list INSIDE-IN extended permit tcp 10.20.0.0 255.255.0.0 any eq 80                ! web\naccess-group INSIDE-IN in interface inside\nssh 10.20.40.10 255.255.255.255 inside   ! SSH solo da PC-TECNICO\n! (indirizzo del tecnico d’esempio; sintassi variabile in Packet Tracer)",
d:"<p>Da svolgere. Prove attese: FTP da PC-TECNICO riesce, da LAPTOP-CL1 fallisce; SSH da PC-TECNICO a FW e SW-PIANO riesce, da PC-REC1 fallisce.</p>"},
{t:"Test finali, riflessione e orale",k:[{p:ALF,c:"ok"}],g:[],hi:[],z:1,
e:"<p><b>Test attesi.</b> PC-REC1 e LAPTOP-CL1 → www.esterno.it: sì. LAPTOP-CL1 → PC-REC1: no. PC-CASA → www.belvedere.it: sì; ping a belvedere.it e 198.51.100.2: no. SRV-WEB → PC-REC1: no. FTP: PC-TECNICO sì, LAPTOP-CL1 no. SSH: PC-TECNICO sì, PC-REC1 no. LAPTOP-INTRUSO: nessun indirizzo.</p>",
x:"<ul><li><b>Come leggere la tabella dei test.</b> Ogni riga verifica un requisito: i test che riescono dimostrano che il servizio funziona, quelli che falliscono dimostrano che la protezione regge.</li><li><b>Navigazione dall’interno.</b> Dimostra routing, DHCP, DNS, PAT e ritorno attraverso il firewall.</li><li><b>Cliente verso reception.</b> Il fallimento dimostra l’ACL sulla VLAN 20 (R3).</li><li><b>PC-CASA verso il sito.</b> Dimostra DNS, NAT statico e permesso sul firewall (R4); il fallimento del ping dimostra R5.</li><li><b>SRV-WEB verso PC-REC1.</b> Il fallimento, anche cambiando il gateway, dimostra DMZ e firewall (R6).</li><li><b>FTP e SSH.</b> Riescono solo dal tecnico (R7).</li><li><b>LAPTOP-INTRUSO.</b> Nessun indirizzo: dimostra port security, porte spente e VLAN parcheggio (R8).</li><li><b>Difesa in profondità.</b> Nessuna protezione è sufficiente da sola: VLAN, ACL, DMZ, firewall, port security e firewall locale lavorano insieme.</li></ul>",
r:"<p><b>1.</b> ACL: giudica ogni pacchetto da solo; firewall stateful: ricorda la sessione e fa rientrare la risposta senza aprire il resto. <b>2.</b> Già possibili: VLAN, DHCP, routing, PAT, filtro clienti, pubblicazione; difficili: isolamento a tre zone e risposte controllate. <b>3.</b> No: non ferma vulnerabilità del sito, password rubate, errori di configurazione. <b>4.</b> Nuovo IP nella DMZ, record DNS, NAT su R-EDGE e regola ASA solo sul servizio. <b>5.</b> Un’ACL troppo stretta che blocca il DNS: show access-lists, Simulation, permesso mirato.</p>",
f:"! Come affrontare una domanda pratica\n! 1) chi parla con chi, con quale servizio (HTTP, DNS, FTP, SSH, ICMP)\n! 2) ipconfig: IP, maschera, gateway, DNS\n! 3) show ip route: il percorso esiste?\n! 4) show ip nat translations: il NAT traduce?\n! 5) show access-lists: quale regola blocca? interfaccia, direzione, ordine\n! 6) firewall: da quale zona a quale, chi ha iniziato?\n! 7) dimostra con un test applicativo e uno di rete",
d:"<p><b>Orale in breve.</b> VLAN e CORE per il routing; DHCP e DNS; PAT su R-EDGE perché 10.20.x.x è privato; ACL clienti; NAT statico per il sito; DMZ senza SVI sul CORE; firewall stateful a tre zone; solo HTTP verso il server; FTP e SSH solo al tecnico; port security; difesa in profondità.</p>"}
];
var G=[["Indirizzo IP","È il “numero di telefono” di un dispositivo in rete, per esempio 10.20.10.6. Due dispositivi nella stessa rete si parlano direttamente; per uscire dalla rete passano dal gateway."],["Maschera di rete (/24)","Dice quanta parte dell’indirizzo identifica la rete. /24 significa 255.255.255.0: i primi tre numeri sono la rete, l’ultimo è il dispositivo. La rete 10.20.10.0/24 ha host da .1 a .254."],["Gateway","È il router a cui un PC consegna i pacchetti destinati a un’altra rete. Se è sbagliato, il PC parla solo con la propria rete. Nelle VLAN dell’hotel il gateway è il CORE (.1)."],["VLAN","Divide uno switch in reti separate, come se fossero switch diversi. Serve a tenere distinti reception, clienti, server e gestione. Per far parlare due VLAN serve un router, ed è lì che si mettono i filtri."],["Porta access e trunk","La porta access appartiene a una sola VLAN (PC, server). Il trunk porta più VLAN sullo stesso cavo, ognuna con un’etichetta (802.1Q). Con allowed vlan si decide quali VLAN possono passare."],["SVI","È l’interfaccia IP virtuale di una VLAN sullo switch multilayer. Il suo indirizzo (.1) è il gateway dei PC di quella VLAN. Senza SVI la VLAN non può uscire dalla propria rete."],["Routing e rotte","Il router decide dove mandare un pacchetto guardando la tabella di routing. Una rotta statica si scrive a mano. La rotta di default (0.0.0.0/0) significa: per tutto ciò che non conosci, vai da questa parte."],["DHCP","Assegna in automatico indirizzo, maschera, gateway e DNS. La richiesta è un broadcast e non esce dalla VLAN: il comando ip helper-address la inoltra al server DHCP."],["DNS","Traduce un nome (www.esterno.it) nel suo indirizzo IP (203.0.113.10). Se il DNS è sbagliato il ping all’IP funziona ma il browser risponde Host Name Unresolved."],["IP privati e pubblici","Gli indirizzi privati (10.x, 172.16–31.x, 192.168.x) valgono solo nella LAN e Internet li scarta. Gli indirizzi pubblici sono instradati ovunque: all’hotel ne spettano cinque (198.51.100.2–.6)."],["NAT","Network Address Translation: il router sostituisce l’indirizzo privato con uno pubblico mentre il pacchetto esce, e rifà l’operazione inversa al ritorno. Così i PC con 10.20.x.x possono usare Internet."],["PAT (NAT overload)","Molti dispositivi condividono un solo IP pubblico. Il router li distingue dal numero di porta e li annota in una tabella (show ip nat translations). Esempio: tutto l’hotel esce come 198.51.100.2."],["NAT statico","Collegamento fisso 1 a 1 tra un IP pubblico e un server interno. Serve quando la comunicazione parte da fuori, come per il sito: 198.51.100.3 porta sempre a SRV-WEB."],["ACL","Elenco di regole permit/deny su indirizzi, protocolli e porte. Il router le legge dall’alto e applica la prima che corrisponde; in fondo c’è un deny invisibile. Si applica a un’interfaccia in entrata (in) o in uscita (out). Wildcard 0.0.0.255 = ignora l’ultimo numero."],["TCP, UDP, ICMP","TCP crea una connessione con tre messaggi (SYN, SYN-ACK, ACK) e poi scambia dati: web, FTP, SSH. UDP invia senza connessione: DNS, DHCP. ICMP serve alla diagnostica: è il ping."],["Porte","Indicano il servizio: HTTP 80, HTTPS 443, DNS 53, FTP 21, SSH 22. Il client usa una porta alta casuale; nella risposta le porte si invertono (sorgente 80, destinazione la porta alta)."],["Stateless e stateful","Un’ACL è stateless: giudica ogni pacchetto da solo e non ricorda nulla. Un firewall stateful ricorda le connessioni aperte dall’interno e lascia rientrare solo le risposte."],["Firewall e livelli di sicurezza","L’ASA assegna a ogni zona un livello: inside 100, dmz 50, outside 0. Il traffico può partire da un livello alto verso uno basso, non il contrario. L’inspection analizza un protocollo (dns, http, icmp) per far rientrare le risposte."],["DMZ","Zona separata dove stanno i server pubblici. Sono raggiungibili solo per i servizi pubblicati e non hanno strada libera verso la rete interna: se vengono violati, il danno resta in quella zona."],["Port security","Limita i MAC address ammessi su una porta. Con sticky la porta impara il MAC del dispositivo; se ne arriva un altro la porta si spegne (violation shutdown)."],["SSH e Telnet","Servono per gestire un apparato da remoto. SSH è cifrato, Telnet manda tutto in chiaro, password comprese: si usa sempre SSH."],["Difesa in profondità","Non ci si affida a una sola protezione: VLAN, ACL, DMZ, firewall, port security e firewall locale lavorano insieme, così un errore non espone tutta la rete."]];
var QA=[null,
[["Come colleghi il CORE a R-EDGE? Ti serve una VLAN nuova? Con quale rete?","Sì, serve un collegamento di livello 3 dedicato. Ho usato la VLAN 50 con la rete 10.20.50.0/24: CORE 10.20.50.1 (SVI) e R-EDGE 10.20.50.2, sul cavo CORE Fa0/24 ↔ R-EDGE G0/0. Una rete a parte evita di mescolare il traffico degli utenti con quello tra i due dispositivi."],["Che cosa deve sapere il CORE per mandare a R-EDGE i pacchetti diretti a Internet? E che cosa deve sapere R-EDGE per riportare le risposte?","Il CORE conosce solo le sue VLAN: gli serve una rotta di default (0.0.0.0/0) verso 10.20.50.2. R-EDGE ha bisogno di una rotta verso 10.20.0.0/16 passando dal CORE (10.20.50.1), altrimenti non sa dove consegnare le risposte, e di una default verso il provider (198.51.100.1)."],["Perché R-ISP non può avere una rotta verso 10.20.0.0/16, anche se sarebbe comodo?","Il provider conosce solo gli indirizzi pubblici dell’hotel: le reti private non si pubblicano su Internet, perché ogni azienda usa le stesse. Con quella rotta il ping funzionerebbe senza NAT, ma nasconderebbe il problema invece di risolverlo."],["Quanti indirizzi pubblici ti servono perché tutto l’hotel navighi? Chi li “presta” ai PC interni, e in quale punto della rete?","Ne basta uno, 198.51.100.2, grazie al PAT: tutti i PC lo condividono e si distinguono dalle porte. Lo presta R-EDGE, che traduce i pacchetti nel punto in cui escono verso il provider."],["In Simulation confronta l’indirizzo sorgente del pacchetto prima e dopo R-EDGE.","Prima di R-EDGE la sorgente è privata (per esempio 10.20.10.6); dopo è 198.51.100.2. Al ritorno R-EDGE fa l’operazione inversa usando la sua tabella delle traduzioni."]],
[["Nel laboratorio 08.3 l’ultima riga del filtro degli ospiti lasciava passare «tutto il resto». Che cosa comprende «tutto il resto», adesso?","Ora comprende Internet (SRV-INTERNET, DNS esterno, PC-CASA), ma anche reti interne che non hai elencato, come transito e DMZ. Per questo, prima dell’ultima riga, si nega tutto 10.20.0.0/16 e R-EDGE."],["Dove applichi il filtro, e in quale direzione? Perché proprio lì?","Sulla SVI della VLAN 20 (interface vlan 20), in direzione in. I pacchetti dei clienti entrano nel CORE proprio da lì: bloccarli subito, vicino alla sorgente, impedisce che raggiungano le altre reti."],["Il DNS che usano i clienti sta su Internet. Serve una regola apposta?","No: l’ultima riga è permit ip any any e il DNS 203.0.113.10 è fuori da 10.20.0.0/16, quindi passa. Servirebbe una regola per UDP 53 solo se l’ultima riga fosse un deny."]],
[["Quale indirizzo pubblico usi per il sito? Lo stesso con cui naviga l’hotel o uno dedicato? Che cosa cambia?","Uno dedicato: 198.51.100.3. La navigazione resta su .2 con il PAT. Un IP dedicato permette un NAT statico 1 a 1, e da fuori è chiaro quale server si raggiunge."],["Nel problema 1 la traduzione partiva dall’interno. Qui chi inizia la comunicazione? Che cosa deve sapere in anticipo R-EDGE?","Inizia PC-CASA, da fuori. R-EDGE non ha ancora nessuna voce in tabella, quindi deve sapere in anticipo a quale server consegnare: per questo si scrive il NAT statico 198.51.100.3 → SRV-WEB."],["Un cliente in camera apre www.belvedere.it: funziona? Annota il risultato.","Non è garantito. Il nome diventa l’IP pubblico .3 e il pacchetto deve uscire e rientrare dallo stesso router (NAT hairpin), che non tutti i router gestiscono. Si prova con LAPTOP-CL1 e si annota il risultato."]],
[["Basta mettere SRV-WEB in una VLAN nuova, con la sua interfaccia sul CORE come per le altre?","No. Se il CORE ha l’SVI della DMZ conosce sia la DMZ sia le reti interne e le instrada tra loro: il traffico non passerebbe da nessun filtro."],["Chi deve essere il gateway di SRV-WEB? Su quale porta di quale dispositivo?","Il dispositivo di confine che filtra la DMZ: prima R-EDGE (10.20.60.1), poi l’interfaccia dmz del firewall (G1/3, 10.20.60.1)."],["Che cosa devi cambiare nella traduzione del problema 3?","L’IP privato di SRV-WEB nel NAT statico, che diventa 10.20.60.10. L’IP pubblico 198.51.100.3 e il record DNS restano uguali."]],
[["Su quali collegamenti deve passare la VLAN DMZ? E la VLAN di transito del problema 1?","La DMZ solo tra SRV-WEB e l’interfaccia dmz del firewall, mai su SW-PIANO. Il transito solo tra CORE e firewall."],["Se aggiungi una VLAN alla lista di un trunk, che cosa succede alle altre? Quale errore hai già visto nella verifica 8.3.3?","Con il comando senza add la lista viene sostituita e le altre VLAN spariscono dal trunk. Per aggiungere si usa allowed vlan add, poi si controlla con show interfaces trunk."],["Che cosa succede se qualcuno stacca SRV-WEB e collega al suo posto un portatile?","Il portatile ha un MAC diverso da quello imparato (sticky): la porta va in violation e si spegne, quindi non entra nella DMZ. Si riattiva con shutdown e no shutdown."]],
[["Perché www.esterno.it non arriva più? Che cosa ha di diverso il pacchetto di ritorno?","La risposta arriva dall’esterno e l’ACL in ingresso la scarta. È un pacchetto diverso dalla richiesta: porta sorgente 80, destinazione una porta alta, indirizzi invertiti."],["Un’ACL estesa può riconoscere le risposte TCP? Funziona per DNS UDP e ping?","Con established riconosce i pacchetti TCP con ACK o RST, ma non conosce la sessione e si può falsificare. Per DNS (UDP) e ping (ICMP) non esiste: si usano regole su indirizzo e porta, oppure echo-reply."],["Quante righe servono per ogni nuovo servizio? Che cosa succede se il DNS cambia porta di origine?","Almeno una riga per servizio. Se il DNS cambia la porta sorgente la regola rigida non corrisponde più e le risposte vengono bloccate, oppure bisogna allargarla troppo."],["Che cosa dovrebbe ricordare il router?","Chi ha iniziato la comunicazione, indirizzi e porte, protocollo e stato della sessione, così da far rientrare solo le vere risposte. È il lavoro di un firewall stateful."]],
[["Che cosa sono nome interfaccia e livello di sicurezza? Quale livello dai a ciascuna zona?","Il nome (nameif) identifica la zona; il livello dice quanto ci si fida: inside 100, dmz 50, outside 0."],["Quale traffico lascia passare senza regole? Quale blocca?","Lascia iniziare il traffico da un livello alto a uno basso (inside→dmz, inside→outside, dmz→outside) e blocca il contrario (outside→inside, outside→dmz, dmz→inside) finché non c’è una regola."],["Tra firewall e R-EDGE serve una rete nuova: quale? Che cosa devono sapere CORE, firewall e R-EDGE? Quali interfacce sono inside/outside per il NAT?","Rete 10.20.70.0/24 (FW .1, R-EDGE .2). CORE: default verso il firewall (10.20.50.2). Firewall: default verso R-EDGE (10.20.70.2) e reti interne verso il CORE. R-EDGE: 10.20.0.0/16 verso il firewall (10.20.70.1) e default verso il provider. Nel NAT di R-EDGE inside è G0/0 (verso il firewall) e outside è G0/1 (verso il provider)."],["Perché le risposte di www.esterno.it rientrano senza regole dedicate?","Il firewall ha registrato la richiesta uscita da inside e riconosce la risposta come parte della stessa sessione, grazie alla tabella di stato e a inspect (dns, http, icmp)."]],
[["Il firewall ricorda le comunicazioni TCP. Il ping usa TCP? Ha una connessione da ricordare?","No: il ping usa ICMP, senza porte e senza connessione TCP. Per questo serve inspect icmp."],["Che cosa significa inspection e quali protocolli sono ispezionati di fabbrica?","Il firewall analizza un protocollo per gestire risposte e traffico correlato. Nel nostro ASA c’erano dns, ftp, icmp e tftp; inspect http l’ho aggiunto. Si controlla con show running-config policy-map."],["Perché aprire il ping con una regola in ingresso dall’esterno sarebbe sbagliato?","Permetterebbe a Internet di iniziare ping verso l’hotel, violando R5. Si fanno rientrare solo le risposte ai ping partiti dall’interno."],["E R-EDGE? Il suo IP pubblico risponde? Rispetta R5? Che cosa puoi fare?","Un ping a 198.51.100.2 è diretto a R-EDGE e non attraversa il firewall: se risponde, R5 non è rispettata. Si risolve con un’ACL in ingresso su G0/1 (BORDO-IN) che blocca l’echo-request."]],
[["Quale dispositivo fa la traduzione e quale permette l’accesso?","R-EDGE traduce 198.51.100.3 in 10.20.60.10 (NAT statico). Il firewall controlla la sicurezza e permette solo HTTP verso il server."],["Nella regola firewall si scrive l’indirizzo pubblico o quello reale di SRV-WEB?","Quello reale (10.20.60.10), perché R-EDGE ha già tradotto il pacchetto prima che arrivi al firewall."],["Su quale interfaccia e direzione si applica la regola?","Sull’interfaccia outside, in ingresso (in): la richiesta HTTP arriva da Internet ed entra nel firewall da lì. L’ACL OUTSIDE-IN resta applicata sull’outside."]],
[["Quali reti conosce il CORE dopo la modifica del collega? Come viaggia il pacchetto?","Con l’SVI della DMZ conosce direttamente DMZ e VLAN interne. Se SRV-WEB lo usa come gateway, il pacchetto va dal CORE alla LAN senza passare dal firewall."],["Chi deve avere un indirizzo nella VLAN DMZ? Chi no?","Solo SRV-WEB e l’interfaccia dmz del firewall. Il CORE e i client di reception e camere non devono avere indirizzi nella DMZ."],["Quale comando sul CORE mostra subito se esiste un’interfaccia di troppo?","show ip interface brief: un’interfaccia Vlan con IP nella rete della DMZ è la scorciatoia da togliere (no interface vlan)."]],
[["Se applichi una regola sull’interfaccia interna, che cosa succede al traffico prima permesso dai livelli? Che cosa devi ricordarti?","Ciò che non è scritto nell’ACL viene bloccato, quindi servirebbero permessi espliciti (DNS, web…). Attenzione: nel simulatore, come dice il prof, un’ACL in ingresso su inside impedisce il rientro di tutte le risposte: non va applicata."],["Il filtro clienti sul CORE si toglie, si tiene o si sposta?","Si tiene: è la seconda barriera sulla VLAN 20. Il prof chiede di togliere la access-list 100 incollata per sbaglio e di applicare CLIENTI-IN con ip access-group … in sulla Vlan20."],["Sull’ASA, come si indica da quale rete e interfaccia è permesso collegarsi per la gestione?","Con ssh rete maschera interfaccia: ssh 10.20.40.10 255.255.255.255 inside. Così solo PC-TECNICO, dall’interno, può entrare in SSH."]],
[["Confronta il file prima del problema 7 con quello finale: quali richieste erano impossibili senza firewall e quali erano già rispettate?","Già rispettate: VLAN, DHCP, routing, NAT, filtro clienti, pubblicazione del sito. Difficili senza firewall: tre zone separate e far rientrare solo le vere risposte (stateful)."],["Il firewall protegge l’hotel da tutto? Fai un esempio di attacco che non può fermare.","No. Controlla il traffico ma non corregge il software: una vulnerabilità del sito, una password rubata o un errore di configurazione passano comunque."],["Se il proprietario volesse pubblicare un secondo sito su un altro server, che cosa cambieresti?","Un server nella DMZ con IP suo, un record DNS, un NAT statico su R-EDGE con un altro IP pubblico (198.51.100.4) e una regola sul firewall solo per quel servizio."],["Hai trovato un caso in cui una misura di sicurezza ha bloccato un utente legittimo? Come l’hai gestito?","Sì: l’ACL INSIDE-IN e l’ACL sull’outside bloccavano il ritorno di web e DNS. Ho letto il messaggio in Simulation, controllato show access-lists e inspect e corretto la regola."]]];

function qa(i){return QA[i].map(function(a,j){return'<div class="qa"><div class="qh">'+(j+1)+'. '+a[0]+'</div><p>'+a[1]+'</p></div>'}).join("")}
G.push(["Cisco ASA","È un firewall Cisco (qui il 5506-X). Ogni interfaccia ha un nome (nameif) e un livello di sicurezza, ricorda le connessioni (stateful) e usa ACL e regole di ispezione. I comandi somigliano a IOS, ma route e nat indicano il nome della zona (route outside …). Nel simulatore alcuni comandi, come show conn, non esistono."],["NAT: inside o outside?","Inside è il lato con gli indirizzi da tradurre (la rete privata, verso CORE e firewall); outside è il lato verso il provider, dove l’indirizzo diventa pubblico. Chiediti: da che parte sono i miei PC e da che parte è Internet? Nel progetto, su R-EDGE: g0/0 = ip nat inside, g0/1 = ip nat outside. Nel NAT statico l’indirizzo privato è quello inside, il pubblico quello visto da fuori."]);
S[2].d+='<p class="q"><b>Correzioni del prof:</b> togliere la access-list 100 incollata per sbaglio e applicare CLIENTI-IN sulla Vlan20 del CORE (ip access-group CLIENTI-IN in).</p>';
S[5].d+='<p class="q"><b>Dal prof:</b> per la prova S14 collegare LAPTOP-INTRUSO alla Fa0/24 di SW-PIANO.</p>';
S[7].d+='<p class="q"><b>Correzione del prof:</b> il web non rientrava per due cause dell’ASA simulato: (1) l’ACL INSIDE-IN in ingresso su inside, che blocca ogni risposta anche con permit ip any any: va tolta con no access-group INSIDE-IN in interface inside; (2) mancava inspect http nella global_policy. L’ACL sull’outside può restare. Dopo aver riaperto il file i PC in DHCP possono non avere subito l’indirizzo: aspetta, ipconfig /renew e ripeti la prova.</p>';
S[7].f+="\n! FW ASA: se avevi un’ACL sull’inside\nno access-group INSIDE-IN in interface inside   ! con quella i ritorni non rientrano (limite del simulatore)";
S[9].f=S[9].f.replace(/OUT-IN/g,"OUTSIDE-IN").replace("! test:","! l’ACL resta applicata sull’outside\n! test:");
S[11].e="<p>Chi aggiorna il sito e chi gestisce gli apparati deve essere solo il tecnico. L’<b>FTP</b> (TCP 21) serve per caricare i file su SRV-WEB ma trasmette tutto in chiaro: lo si limita a PC-TECNICO. La gestione di firewall e switch si fa in <b>SSH</b>, cifrato, mai in Telnet.</p><p><b>Novità del prof.</b> L’ACL INSIDE-IN in ingresso su inside non si può usare: nel simulatore blocca ogni risposta. Per ottenere lo stesso risultato si prova, in quest’ordine, e si annota cosa funziona: (a) ACL FTP-DMZ sul CORE, in uscita sulla Vlan 50 (verso il firewall); (b) ACL in uscita sull’interfaccia dmz del firewall; (c) firewall locale di SRV-WEB. Il filtro clienti sul CORE resta come seconda barriera.</p>";
S[11].f="! CORE: FTP verso la DMZ solo dal tecnico (prova a)\nip access-list extended FTP-DMZ\n permit tcp host 10.20.40.10 host 10.20.60.10 eq 21   ! solo PC-TECNICO\n deny tcp any host 10.20.60.10 eq 21                    ! nessun altro FTP\n permit ip any any                                      ! il resto passa\ninterface vlan 50\n ip access-group FTP-DMZ out    ! verso il firewall\n! CORE: SSH solo dal tecnico (stesso blocco su SW-PIANO)\nip domain-name belvedere.local\ncrypto key generate rsa modulus 1024\nusername tecnico secret ********\naccess-list 10 permit host 10.20.40.10\nline vty 0 4\n login local\n transport input ssh              ! niente Telnet\n access-class 10 in               ! solo PC-TECNICO\n! FW ASA: SSH solo dal tecnico (prova b: ACL in uscita su dmz)\nssh 10.20.40.10 255.255.255.255 inside\naccess-list DMZ-OUT extended permit tcp host 10.20.40.10 host 10.20.60.10 eq 21\naccess-list DMZ-OUT extended permit tcp any host 10.20.60.10 eq 80\naccess-group DMZ-OUT out interface dmz\n! SRV-WEB: firewall locale (prova c)\n! Services > Firewall: permit TCP 80 any · permit TCP 21 solo 10.20.40.10 · deny il resto";
S[11].d="<p><b>Da svolgere.</b> Prova (a), poi (b), poi (c) e annota cosa succede. <b>Prove attese:</b> FTP da PC-TECNICO a SRV-WEB riesce, da LAPTOP-CL1 no; SSH da PC-TECNICO a FW, SW-PIANO e CORE riesce, da PC-REC1 no; il web continua a funzionare. Sintassi variabile in Packet Tracer.</p>";
